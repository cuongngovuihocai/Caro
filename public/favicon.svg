<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner grid pattern accent -->
  <path d="M170 0 V512 M342 0 V512 M0 170 H512 M0 342 H512" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6" />

  <!-- Vector group with drop shadow -->
  <g filter="url(#shadow)">
    <!-- X Symbol -->
    <line x1="110" y1="170" x2="250" y2="342" stroke="#ffffff" stroke-width="48" stroke-linecap="round" />
    <line x1="250" y1="170" x2="110" y2="342" stroke="#ffffff" stroke-width="48" stroke-linecap="round" />

    <!-- O Symbol -->
    <circle cx="360" cy="256" r="68" fill="none" stroke="#fef08a" stroke-width="44" />
  </g>
</svg>
